name: Publish tcaf-model to PyPI

# Tag tcaf-v1.0.0 to publish tcaf-model 1.0.0 on PyPI, then open a bump PR in
# the app. The file name is bound to the PyPI trusted publisher, keep it.
on:
  push:
    tags: ['tcaf-v*']

jobs:
  lint:
    uses: ./.github/workflows/_lint.yaml

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS files are real (not pointers)
        run: |
          pickle_count=$(find . -name "*.pickle" | wc -l)
          echo "Found $pickle_count pickle files"
          if [ "$pickle_count" -lt 10 ]; then
            echo "ERROR: Expected at least 10 pickle files, got $pickle_count"
            exit 1
          fi
          if head -c 40 tcaf_model/_database/data/datamatrix/agriculture.pickle | grep -q "git-lfs"; then
            echo "ERROR: pickles are still LFS pointers, checkout did not fetch them"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: uv pip install --system build twine

      - name: Build package
        run: python -m build

      - name: Verify wheel contains data
        run: |
          count=$(unzip -l dist/*.whl | grep -c '\.pickle' || true)
          echo "Pickle files in wheel: $count"
          if [ "$count" -lt 10 ]; then
            echo "ERROR: wheel has no data"
            exit 1
          fi

      - name: Check the metadata PyPI will show
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.APP_REPO_TOKEN }}
          repository: EPFL-ENAC/leure-speed-to-zero
          event-type: model-updated
          client-payload: '{"tag": "${{ github.ref_name }}", "package": "tcaf-model"}'

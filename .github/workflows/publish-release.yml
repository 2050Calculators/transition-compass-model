name: Publish release

# Tag tcaf-v1.0.0 to build the wheel and attach it to a GitHub release.
# The app installs that wheel by URL, this model is not published on PyPI.
on:
  push:
    tags: ['tcaf-v*']

jobs:
  lint:
    uses: ./.github/workflows/_lint.yaml

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS files are real (not pointers)
        run: |
          pickle_count=$(find . -name "*.pickle" | wc -l)
          echo "Found $pickle_count pickle files"
          if [ "$pickle_count" -lt 10 ]; then
            echo "ERROR: Expected at least 10 pickle files, got $pickle_count"
            exit 1
          fi
          if head -c 40 transition_compass_model/_database/data/datamatrix/agriculture.pickle | grep -q "git-lfs"; then
            echo "ERROR: pickles are still LFS pointers, checkout did not fetch them"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: uv pip install --system build

      - name: Build package
        run: python -m build

      - name: Verify wheel contains data
        run: |
          count=$(unzip -l dist/*.whl | grep -c '\.pickle' || true)
          echo "Pickle files in wheel: $count"
          if [ "$count" -lt 10 ]; then
            echo "ERROR: wheel has no data"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release with the wheel attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
